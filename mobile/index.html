<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>防哽咽 AI 即時監測 —— 被照護者相機端</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- MediaPipe Tasks Vision CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/vision_bundle.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col justify-between select-none">

    <!-- 頂部 Header 導覽條 -->
    <header class="bg-slate-900/90 backdrop-blur border-b border-slate-800 px-4 py-3 flex items-center justify-between sticky top-0 z-40">
        <div class="flex items-center space-x-2">
            <span class="text-2xl">🛡️</span>
            <div>
                <h1 class="font-bold text-base text-blue-400 leading-tight">防哽咽 AI 即時監測</h1>
                <p class="text-[11px] text-slate-400" id="current-patient-label">未登入個案</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <button id="btn-login-modal" onclick="openLoginModal()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1.5 rounded-lg border border-slate-700 transition">
                🔑 身分切換
            </button>
            <a href="caregiver.html" target="_blank" class="text-xs bg-blue-600/30 hover:bg-blue-600/50 text-blue-300 border border-blue-500/40 px-2.5 py-1.5 rounded-lg font-semibold transition">
                🖥️ 照護儀表板
            </a>
        </div>
    </header>

    <!-- 主要相機與 AI 監測內容區 -->
    <main class="flex-1 max-w-md w-full mx-auto p-4 flex flex-col justify-center space-y-4">

        <!-- 質地選擇卡片 -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3 shadow-lg">
            <label class="text-xs font-semibold text-slate-400 block mb-2">🍽️ 請選擇本次用餐質地：</label>
            <div class="grid grid-cols-3 gap-2">
                <button onclick="selectDiet('regular')" id="btn-diet-regular" class="diet-btn bg-blue-600 text-white font-bold py-2 rounded-xl text-xs shadow border border-blue-400 transition">
                    普通餐食<br><span class="text-[10px] opacity-80">(需咬10-20下)</span>
                </button>
                <button onclick="selectDiet('soft')" id="btn-diet-soft" class="diet-btn bg-slate-800 text-slate-300 font-semibold py-2 rounded-xl text-xs hover:bg-slate-700 border border-slate-700 transition">
                    軟食餐盒<br><span class="text-[10px] opacity-80">(需咬16-18下)</span>
                </button>
                <button onclick="selectDiet('pureed')" id="btn-diet-pureed" class="diet-btn bg-slate-800 text-slate-300 font-semibold py-2 rounded-xl text-xs hover:bg-slate-700 border border-slate-700 transition">
                    碎食餐<br><span class="text-[10px] opacity-80">(需咬3-10下)</span>
                </button>
            </div>
        </div>

        <!-- AI 相機 Viewport 與 Canvas 繪圖面板 -->
        <div class="relative w-full aspect-[4/3] bg-black rounded-2xl overflow-hidden border-2 border-slate-800 shadow-2xl">
            <!-- 隱藏式 Video 標籤用於擷取 WebCam -->
            <video id="webcam-video" class="hidden" playsinline muted></video>
            
            <!-- Canvas 用於繪製即時骨架、粉紅喉嚨圈與下巴波形 -->
            <canvas id="ai-canvas" class="w-full h-full object-cover"></canvas>

            <!-- MediaPipe 載入提示層 (預設隱藏，不再卡住畫面) -->
            <div id="loading-overlay" class="absolute inset-0 bg-slate-950/90 backdrop-blur hidden flex flex-col items-center justify-center p-6 text-center space-y-3 z-30">
                <div class="w-10 h-10 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
                <h3 class="font-bold text-slate-200 text-sm">正在載入 MediaPipe AI 模型...</h3>
                <p class="text-[11px] text-slate-400">背景下載中，您可以直接開始用餐與開啟相機</p>
            </div>

            <!-- 實時狀態 HUD Overlay -->
            <div class="absolute top-3 left-3 bg-slate-900/80 backdrop-blur px-3 py-1.5 rounded-xl border border-slate-700/60 text-[11px] space-y-0.5">
                <div class="flex items-center space-x-2">
                    <span class="text-slate-400">AI 模型:</span>
                    <span id="hud-ai-status" class="font-bold text-amber-400">⏳ 載入中...</span>
                </div>
                <div class="flex items-center space-x-2">
                    <span class="text-slate-400">當前質地:</span>
                    <span id="hud-diet" class="font-bold text-blue-300">普通餐食</span>
                </div>
                <div class="flex items-center space-x-2">
                    <span class="text-slate-400">累積咀嚼:</span>
                    <span id="hud-chews" class="font-mono font-bold text-emerald-400 text-sm">0 次</span>
                </div>
                <div class="flex items-center space-x-2">
                    <span class="text-slate-400">成功吞嚥:</span>
                    <span id="hud-swallows" class="font-mono font-bold text-blue-400 text-sm">0 次</span>
                </div>
                <div class="flex items-center space-x-2">
                    <span class="text-slate-400">下巴速度:</span>
                    <span id="hud-jaw-vel" class="font-mono text-slate-200">0.00</span>
                </div>
                <div class="flex items-center space-x-2">
                    <span class="text-slate-400">嘴唇藍光比:</span>
                    <span id="hud-cyanosis" class="font-mono text-emerald-400 font-bold">0.25 (正常)</span>
                </div>
                <div class="flex items-center space-x-2">
                    <span class="text-slate-400">證據融合分:</span>
                    <span id="hud-fusion-score" class="font-mono text-blue-300 font-bold">0.00 / 1.0</span>
                </div>
            </div>

            <!-- 畫面中央底部 動態動作狀態 Pill -->
            <div class="absolute bottom-3 left-1/2 -translate-x-1/2 bg-slate-900/90 backdrop-blur px-4 py-1.5 rounded-full border border-slate-700/80 shadow-lg flex items-center space-x-2 z-20">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse" id="hud-action-dot"></span>
                <span id="hud-action-state" class="font-bold text-xs text-slate-200">👄 準備用餐中...</span>
            </div>

            <!-- 右上角 聲音波形 HUD -->
            <div class="absolute top-3 right-3 bg-slate-900/80 backdrop-blur px-2.5 py-1.5 rounded-xl border border-slate-700/60 flex items-center space-x-2">
                <span class="text-[10px] text-slate-400">🎤 聲音</span>
                <div class="w-12 h-2 bg-slate-800 rounded-full overflow-hidden">
                    <div id="hud-mic-bar" class="h-full bg-blue-500 w-0 transition-all duration-75"></div>
                </div>
            </div>

            <!-- 警報跳窗圖層 (Level 1 - Level 4) -->
            <div id="alert-overlay" class="absolute inset-0 hidden flex flex-col items-center justify-center bg-rose-600/90 backdrop-blur-md p-6 text-center z-30 animate-pulse">
                <span class="text-6xl mb-2 animate-bounce">🚨</span>
                <h2 id="alert-title" class="text-2xl font-black text-white tracking-wider mb-2">L4 急劇嗆咳爆發警報</h2>
                <p id="alert-desc" class="text-sm text-rose-100 mb-6">偵測到下巴劇烈痙攣與聲音能量爆發，已即時通知遠端照護員！</p>
                <button onclick="dismissAlertOverlay()" class="bg-white text-rose-900 font-bold px-6 py-2.5 rounded-xl shadow-lg hover:bg-slate-100 transition">
                    解除警報 ✕
                </button>
            </div>
        </div>

        <!-- 開始 / 結束 用餐按鈕列 -->
        <div class="grid grid-cols-2 gap-3">
            <button id="btn-start-meal" onclick="startMealSession()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-2xl shadow-lg flex items-center justify-center space-x-2 text-base transition border border-emerald-400">
                <span>🍽️</span>
                <span>開始用餐</span>
            </button>
            <button id="btn-end-meal" onclick="endMealSession()" disabled class="bg-slate-800 text-slate-500 font-bold py-3.5 rounded-2xl shadow flex items-center justify-center space-x-2 text-base cursor-not-allowed border border-slate-700 transition">
                <span>⏹️</span>
                <span>結束用餐</span>
            </button>
        </div>

    </main>

    <!-- 底部個案即時評分卡片 -->
    <footer class="bg-slate-900/90 border-t border-slate-800 p-3 max-w-md w-full mx-auto text-xs text-slate-400 flex items-center justify-between">
        <div>
            <span>用餐狀態: </span>
            <span id="meal-status-text" class="font-bold text-slate-300">尚未開始</span>
        </div>
        <div>
            <span>即時風險評級: </span>
            <span id="risk-badge" class="font-bold text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/30">🟢 正常</span>
        </div>
    </footer>

    <!-- 個案登入與 PIN 碼 Modal -->
    <div id="login-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 max-w-xs w-full shadow-2xl space-y-4">
            <div class="text-center">
                <span class="text-4xl">🔑</span>
                <h3 class="font-bold text-lg text-slate-100 mt-2">請選擇被照護者帳號</h3>
                <p class="text-xs text-slate-400">載入該個案的個人化咀嚼與吞嚥平均值</p>
            </div>
            
            <div class="space-y-2">
                <button onclick="loginAsPatient('P001', '王爺爺 (軟食)')" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 p-3 rounded-2xl font-semibold text-left flex items-center justify-between border border-slate-700 transition">
                    <span>👴 王爺爺 (P001)</span>
                    <span class="text-xs text-blue-400">82歲 · 軟食</span>
                </button>
                <button onclick="loginAsPatient('P002', '陳奶奶 (碎食)')" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 p-3 rounded-2xl font-semibold text-left flex items-center justify-between border border-slate-700 transition">
                    <span>👵 陳奶奶 (P002)</span>
                    <span class="text-xs text-blue-400">78歲 · 碎食</span>
                </button>
                <button onclick="loginAsPatient('P003', '林伯伯 (普通餐)')" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 p-3 rounded-2xl font-semibold text-left flex items-center justify-between border border-slate-700 transition">
                    <span>👨 林伯伯 (P003)</span>
                    <span class="text-xs text-blue-400">85歲 · 普通餐</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 腳本引用 -->
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
